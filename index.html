  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="const fallback=document.createElement('script');fallback.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';fallback.onload=()=>window.startOcean?.();document.head.appendChild(fallback)"></script>
  <script>
  window.startOcean = () => {
    if (window.oceanStarted || !window.THREE) return;
    window.oceanStarted = true;
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    const pixelRatio = () => Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(4000000 / (innerWidth * innerHeight)));
    renderer.setPixelRatio(pixelRatio());
    renderer.setSize(innerWidth, innerHeight);
    renderer.autoClear = true;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quad = new THREE.PlaneBufferGeometry(2, 2);
    const scene = new THREE.Scene();
    const simScene = new THREE.Scene();
    const simSize = 256;
    const targetOptions = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false };
    let read = new THREE.WebGLRenderTarget(simSize, simSize, targetOptions);
    let write = new THREE.WebGLRenderTarget(simSize, simSize, targetOptions);
    renderer.setRenderTarget(read); renderer.clear();
    renderer.setRenderTarget(write); renderer.clear();
    renderer.setRenderTarget(null);
    const vertexShader = 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }';

    const simMaterial = new THREE.ShaderMaterial({
      uniforms: { previous: {value: read.texture}, texel: {value: new THREE.Vector2(1/simSize, 1/simSize)}, pointer: {value: new THREE.Vector2(-10,-10)}, impulse: {value: 0}, tick: {value: 0} },
      vertexShader,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D previous;
        uniform vec2 texel, pointer;
        uniform float impulse, tick;
        void main(){
          vec2 state = texture2D(previous,vUv).rg;
          float l = texture2D(previous,vUv-vec2(texel.x,0.)).r;
          float r = texture2D(previous,vUv+vec2(texel.x,0.)).r;
          float b = texture2D(previous,vUv-vec2(0.,texel.y)).r;
          float t = texture2D(previous,vUv+vec2(0.,texel.y)).r;
          float edge = smoothstep(0.,.115,min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y)));
          float velocity = (state.g + (l+r+b+t-4.*state.r)*.23)*.985*edge;
          float height = (state.r + velocity)*.997*edge;
          height += impulse*exp(-dot(vUv-pointer,vUv-pointer)*2000.);
          vec2 source=vec2(.29,.66);
          height += .00046*exp(-dot(vUv-source,vUv-source)*350.)*sin(tick*.11);
          gl_FragColor=vec4(height,velocity,0.,1.);
        }`
    });
    simScene.add(new THREE.Mesh(quad, simMaterial));

    function palmTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const c = canvas.getContext('2d');
      const p = (x,y) => [x*1024,y*1024];
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.strokeStyle = '#000'; c.fillStyle = '#000';
      c.beginPath(); c.moveTo(...p(.23,-.025)); c.bezierCurveTo(...p(.25,.12),...p(.34,.35),...p(.42,.48)); c.lineWidth=10; c.stroke();
      const cx=.42,cy=.48;
      for(let i=0;i<8;i++){
        const angle=(-2.45+i*.70), length=.18+(i%3)*.026;
        const dx=Math.cos(angle)*length, dy=Math.sin(angle)*length;
        const ex=cx+dx, ey=cy+dy;
        c.beginPath();c.moveTo(...p(cx,cy));c.quadraticCurveTo(...p(cx+dx*.58,cy+dy*.58-.018),...p(ex,ey));c.lineWidth=2.5;c.stroke();
        for(let j=1;j<=10;j++){
          const f=j/11, bx=cx+dx*f, by=cy+dy*f-.018*Math.sin(f*Math.PI);
          const leafLen=(1.-f)*.061+.013;
          for(const side of [-1,1]){
            const nx=-Math.sin(angle)*side, ny=Math.cos(angle)*side;
            const tx=bx+nx*leafLen+dx*.06, ty=by+ny*leafLen+dy*.06;
            c.beginPath(); c.moveTo(...p(bx-dx*.011,by-dy*.011));
            c.quadraticCurveTo(...p(bx+nx*leafLen*.53+dx*.026,by+ny*leafLen*.53+dy*.026-.009),...p(tx,ty));
            c.quadraticCurveTo(...p(bx+nx*leafLen*.55-dx*.019,by+ny*leafLen*.55-dy*.019+.006),...p(bx+dx*.012,by+dy*.012));
            c.closePath(); c.fill();
          }
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter=THREE.LinearFilter;
      return texture;
    }
    const palm = palmTexture();

    // One bounded, procedural texture keeps the ecosystem beneath the water shader.
    const ecology = document.createElement('canvas');
    const ec = ecology.getContext('2d');
    const ecoTexture = new THREE.CanvasTexture(ecology);
    ecoTexture.generateMipmaps = false;
    ecoTexture.minFilter = THREE.LinearFilter;
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    let ecoDirty = true, lastEco = -Infinity, seed = 7319;
    const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const habitats = [[.23,.78,.045],[.48,.61,.034],[.69,.87,.041],[.82,.36,.027]];
    const plants = Array.from({length:40}, (_,i) => {
      const site=habitats[i%habitats.length];
      return {x:site[0]+(random()-.5)*.10,y:site[1]+(random()-.5)*.08,h:.013+random()*.033,phase:random()*6.28};
    });
    const fish = Array.from({length:38}, (_,i) => ({school:i%3,phase:random()*6.28,offset:random(),scatter:0}));
    const placedFish=[];
    const animalScene=new THREE.Scene();
    animalScene.add(new THREE.HemisphereLight(0xe5ffed,0x153b51,1.1));
    const sun=new THREE.DirectionalLight(0xfff3d1,1.2);sun.position.set(-3,5,8);animalScene.add(sun);
    const animalCamera=new THREE.OrthographicCamera(0,innerWidth/innerHeight,1,0,.1,20);animalCamera.position.z=8;
    const animalTarget=new THREE.WebGLRenderTarget(1024,640,{depthBuffer:true});
    const creatureNames=['Manta','Spotted Eagle Ray','Blue-spotted Stingray','Moon Jelly','Sea Nettle'];
    const descriptions=['Ocean glider','Spotted wings','Lagoon wanderer','Four delicate hearts','Amber & silk'];
    document.querySelector('.fish-cards').innerHTML=creatureNames.map((name,i)=>`<button class="fish-card" data-fish="${i}" aria-label="Cast or drag ${name}"><svg></svg><span>${name}</span></button>`).join('');
    /* Original r128/WebGL creature meshes. Bell deformation adapted from Aurelia's
       phase/zenith method (Holtsetio, MIT); full notice at the end of this file. */
    const rayVertex = `
      uniform float clock; varying vec3 vN,vP; varying vec2 vTex;
      void main(){vec3 p=position;float span=abs(p.y);
        float flap=sin(clock*1.65-span*1.15)*.24+sin(clock*1.65-span*.65)*.08;
        p.z+=flap*span*span*.65;
        vec3 n=normal;n.y-=sign(p.y)*flap*span*1.3;
        vN=normalize(normalMatrix*n);vP=(modelViewMatrix*vec4(p,1.)).xyz;vTex=uv;
        gl_Position=projectionMatrix*vec4(vP,1.);
      }`;
    function rayMaterial(type, underside=false){
      return new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{clock:{value:0},kind:{value:type},belly:{value:underside?1:0}},vertexShader:rayVertex,
        fragmentShader:`precision highp float; uniform float kind,belly;varying vec3 vN,vP;varying vec2 vTex;
          float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
          void main(){vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;vec3 eye=normalize(-vP);
            float diffuse=dot(n,normalize(vec3(-.4,.6,1.)));
            float shade=.62+.22*smoothstep(-.15,.12,diffuse)+.16*smoothstep(.5,.62,diffuse);
            vec3 base=kind<.5?vec3(.13,.24,.29):kind<1.5?vec3(.10,.23,.26):vec3(.73,.58,.29);
            float center=exp(-pow((vTex.x-.57)*3.4,2.)-pow((vTex.y-.5)*5.,2.));
            base=mix(base,kind<1.5?vec3(.38,.53,.55):vec3(.88,.76,.46),center*.62);
            vec2 cell=floor(vTex*vec2(18.,24.)),local=fract(vTex*vec2(18.,24.));
            vec2 spot=vec2(.25)+vec2(hash(cell),hash(cell+7.))*.5;
            float radius=.095+hash(cell+17.)*.075;
            float spots=(1.-smoothstep(radius,radius+.035,length(local-spot)))*step(.27,hash(cell+29.));
            if(kind>.5)base=mix(base,kind<1.5?vec3(.91,.91,.77):vec3(.12,.67,.87),spots*.95);
            if(belly>.5)base=vec3(.71,.83,.78);
            float rim=pow(1.-abs(dot(n,eye)),3.);float spec=pow(max(dot(reflect(-normalize(vec3(-.4,.6,1.)),n),eye),0.),38.);
            gl_FragColor=vec4(base*shade+vec3(.50,.76,.74)*rim*.16+spec*.14,1.);
          }`});
    }
    function raySurface(type,lower){
      const positions=[],uvs=[],indices=[],rings=48,segments=28;
      for(let j=0;j<=rings;j++)for(let i=0;i<=segments;i++){
        const v=j/rings*2-1,u=i/segments,edge=Math.abs(v),span=type===2?1.14:2.12;
        const y=v*span,chord=Math.sqrt(Math.max(0,1-v*v));
        const leading=type===2?chord*1.08:1.12-1.02*Math.pow(edge,.72)-.68*Math.pow(edge,3);
        const trailing=type===2?-chord*.98:-1.0+.42*Math.pow(edge,.8);
        const x=trailing+(leading-trailing)*u,core=Math.exp(-Math.pow(y/.45,2.));
        const thickness=Math.sin(u*Math.PI)*chord*(.026+.27*core);
        const z=(lower?-thickness*.48:thickness)+.035*Math.sin(v*3)*Math.sin(u*Math.PI);
        positions.push(x,y,z);uvs.push((x+1.35)/2.6,(v+1)/2);
        if(j<rings&&i<segments){const n=j*(segments+1)+i;if(lower)indices.push(n,n+segments+1,n+1,n+1,n+segments+1,n+segments+2);else indices.push(n,n+1,n+segments+1,n+1,n+segments+2,n+segments+1);}
      }
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));g.setIndex(indices);g.computeVertexNormals();return g;
    }
    function makeCreature(type){
      const group=new THREE.Group();group.userData.type=type;
      const pearl=new THREE.MeshPhongMaterial({color:0x122d38,shininess:95,specular:0xb8eee4});
      if(type<3){
        const mat=rayMaterial(type),body=new THREE.Mesh(raySurface(type,false),mat);body.name='ray';group.add(body);
        const underside=new THREE.Mesh(raySurface(type,true),rayMaterial(type,true));group.add(underside);
        for(const side of [-1,1]){
          const eye=new THREE.Mesh(new THREE.SphereBufferGeometry(1,16,12),pearl);eye.scale.set(.11,.075,.08);eye.position.set(.69,side*.30,.23);group.add(eye);
          const glint=new THREE.Mesh(new THREE.SphereBufferGeometry(.024,8,6),new THREE.MeshBasicMaterial({color:0xeffff5}));glint.position.copy(eye.position).add(new THREE.Vector3(.025,-.017,.07));group.add(glint);
          if(type===0){
            const path=new THREE.CatmullRomCurve3([new THREE.Vector3(.72,side*.32,.13),new THREE.Vector3(1.07,side*.31,.15),new THREE.Vector3(1.25,side*.19,.22)]);
            group.add(new THREE.Mesh(new THREE.TubeBufferGeometry(path,16,.095,8,false),new THREE.MeshPhongMaterial({color:0x3d626a,shininess:40})));
          }
        }
        const path=new THREE.CatmullRomCurve3([new THREE.Vector3(-.8,0,-.02),new THREE.Vector3(-1.45,.02,-.04),new THREE.Vector3(-2.1,.14,-.06),new THREE.Vector3(-2.85,.27,-.10)]);
        const tail=new THREE.Mesh(new THREE.TubeBufferGeometry(path,32,type===2?.024:.029,6,false),new THREE.MeshPhongMaterial({color:type===2?0xb59a58:0x29454f,shininess:30}));tail.name='tail';group.add(tail);
      }else{
        const amber=type===4;
        const bellMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
          uniforms:{clock:{value:0},pulse:{value:0},amber:{value:amber?1:0}},
          vertexShader:`uniform float clock,pulse;varying vec3 vN,vP;varying vec2 vTex;
            void main(){vec3 p=position;float r=length(p.xy),a=atan(p.y,p.x);
              float margin=smoothstep(.65,1.,r),lag=pulse*(1.-r*.22);
              float modifiedPhase=pulse*1.9-r*r*.95+1.570796;float radius=(sin(modifiedPhase)*.3+1.3)/1.6;p.xy*=radius;p.z=p.z*(1.+lag*.30)+margin*(sin(a*24.+clock*1.5)*.019-lag*.12);
              vTex=uv;vN=normalize(normalMatrix*normal);vP=(modelViewMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*vec4(vP,1.);
            }`,
          fragmentShader:`precision highp float;uniform float amber,clock,pulse;varying vec3 vN,vP;varying vec2 vTex;
            void main(){vec2 q=(vTex-.5)*2.;float r=length(q),a=atan(q.y,q.x);
              vec3 n=normalize(vN),eye=normalize(-vP);float fres=pow(1.-abs(dot(n,eye)),2.4);
              float canal=pow(.5+.5*cos(a*32.+sin(r*8.)*.12),34.)*smoothstep(.14,.6,r);
              float hem=exp(-pow((r-.975)*55.,2.));
              float stripe=pow(.5+.5*cos(a*16.+sin(r*4.)*.28),9.)*smoothstep(.15,.85,r);
              vec3 base=mix(vec3(.49,.79,.85),vec3(.98,.66,.22),amber);
              base=mix(base,vec3(.54,.19,.075),stripe*amber*.63);
              float sheen=pow(max(dot(reflect(-normalize(vec3(-.45,.55,1.)),n),eye),0.),45.);
              vec3 color=base*(.84+.16*max(n.z,0.))+vec3(.68,.91,1.)*fres*.48+canal*.13*(1.-amber)+hem*.18+sheen*.37;
              float alpha=mix(.29,.57,amber)+fres*.30+hem*.20+canal*.12;
              gl_FragColor=vec4(color,alpha);
            }`});
        const p=[],uv=[],idx=[],radial=24,angular=96;
        for(let j=0;j<=radial;j++)for(let i=0;i<=angular;i++){
          const theta=j/radial*Math.PI*.50,a=i/angular*Math.PI*2,r=Math.sin(theta),frill=1+Math.pow(r,8)*Math.cos(a*24)*.017;
          p.push(Math.cos(a)*r*frill,Math.sin(a)*r*frill,Math.cos(theta)*(amber?.70:.38));uv.push(.5+Math.cos(a)*r*.5,.5+Math.sin(a)*r*.5);
          if(j<radial&&i<angular){const n=j*(angular+1)+i;idx.push(n,n+1,n+angular+1,n+1,n+angular+2,n+angular+1);}
        }
        const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
        const bell=new THREE.Mesh(g,bellMat);bell.name='bell';bell.renderOrder=3;group.add(bell);
        const organs=new THREE.Group();organs.name='organs';group.add(organs);
        if(!amber)for(let i=0;i<4;i++){
